name: Ritnome institutional
on:
  push:
    branches: [ritnome-institutional-live-candidate]
  pull_request:
    branches: [ritnome-institutional-live-candidate]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: for t in ritnome-*.test.js; do case "$t" in *.local.test.js|*.browser.test.js) ;; *) node "$t" || exit 1;; esac; done
  reporting-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm install --no-save pg@8
      - run: security-review/test/apply-local.sh ritci
      - run: psql -d ritci -f security-review/test/reporting-foundation-tests.sql | tee /tmp/sql.txt; ! grep -q FAIL /tmp/sql.txt
      - run: RITNOME_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/ritci node ritnome-reporting.local.test.js
  browser:
    # Needs the ritnome-bpm checkout; the default token cannot read another private repo, so this job is advisory.
    # The browser suite is the release gate when run locally (see security-review/test/README).
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: hooporiapr-oss/ritnome-bpm, ref: main, path: site, token: "${{ secrets.RITNOME_SITE_TOKEN || secrets.GITHUB_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { repository: hooporiapr-oss/reaction-velocity, ref: main, path: rv, token: "${{ secrets.RITNOME_SITE_TOKEN || secrets.GITHUB_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { repository: hooporiapr-oss/fortress-mobi, ref: main, path: mobi, token: "${{ secrets.RITNOME_SITE_TOKEN || secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm install --no-save pg@8 playwright@1 && npx playwright install --with-deps chromium
      - run: security-review/test/apply-local.sh ritci
      - run: RITNOME_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/ritci RITNOME_BPM_DIR="$PWD/site" node ritnome-institutional.browser.test.js
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -qc "DROP DATABASE ritci" -c "CREATE DATABASE ritci" && security-review/test/apply-local.sh ritci && RITNOME_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/ritci node ritnome-desk.browser.test.js
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -qc "DROP DATABASE ritci" -c "CREATE DATABASE ritci" && security-review/test/apply-local.sh ritci && psql postgres://postgres:postgres@localhost:5432/ritci -v ON_ERROR_STOP=1 -f security-review/test/trial-tests.sql | tee /dev/stderr | grep -q "| FAIL" && exit 1 || true
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -qc "DROP DATABASE ritci" -c "CREATE DATABASE ritci" && security-review/test/apply-local.sh ritci && psql postgres://postgres:postgres@localhost:5432/ritci -v ON_ERROR_STOP=1 -f security-review/test/r1-tests.sql | tee /dev/stderr | grep -q "| FAIL" && exit 1 || true
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -qc "DROP DATABASE ritci" -c "CREATE DATABASE ritci" && security-review/test/apply-local.sh ritci && RITNOME_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/ritci RITNOME_BPM_DIR="$PWD/site" RITNOME_RV_DIR="$PWD/rv" RITNOME_MOBI_DIR="$PWD/mobi" node ritnome-activities.browser.test.js
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -qc "DROP DATABASE ritci" -c "CREATE DATABASE ritci" && security-review/test/apply-local.sh ritci && RITNOME_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/ritci RITNOME_RV_DIR="$PWD/rv" node ritnome-progress.browser.test.js
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -qc "DROP DATABASE ritci" -c "CREATE DATABASE ritci" && security-review/test/apply-local.sh ritci && RITNOME_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/ritci node ritnome-report.browser.test.js
      - run: psql postgres://postgres:postgres@localhost:5432/postgres -qc "DROP DATABASE ritci" -c "CREATE DATABASE ritci" && security-review/test/apply-local.sh ritci && RITNOME_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/ritci node ritnome-record.browser.test.js
