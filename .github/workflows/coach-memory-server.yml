name: Coach Memory server validation
on:
  pull_request:
    paths: ['coach-memory/**', 'server.js', '.github/workflows/coach-memory-server.yml']
  push:
    branches: [feature/coach-memory-backend]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node coach-memory/coach-memory-service.test.cjs
      - run: node coach-memory/coach-memory-http.test.cjs
      - run: node coach-memory/coach-memory-install.test.cjs
  local-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: coach_memory_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d coach_memory_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_test_only
      PGDATABASE: coach_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply the schema to the disposable database
        run: |
          set -eu
          for f in sql-test-bootstrap athlete-identity-draft coach-memory-draft access-control-draft enrollment-transaction-draft coach-memory-engine-draft session-authorization-draft backend-role-draft goal-backend-role-draft admin-ops-draft enrollment-list-role-draft; do
            psql -X -v ON_ERROR_STOP=1 -f "coach-memory/staging/$f.sql"
          done
          psql -X -v ON_ERROR_STOP=1 -c "create role cm_test_login login noinherit password 'synthetic_test_only'; grant coach_memory_backend to cm_test_login;"
      - name: Real handler, restricted pool and fake Auth on loopback
        env:
          COACH_MEMORY_TEST_DATABASE_URL: postgres://cm_test_login:synthetic_test_only@localhost:5432/coach_memory_test
          COACH_MEMORY_TEST_ADMIN_URL: postgres://postgres:synthetic_test_only@localhost:5432/coach_memory_test
        run: node coach-memory/local-integration.test.cjs
